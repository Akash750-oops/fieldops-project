<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>FieldOps Commander ΓÇö Jobs Dashboard</title>
  <!-- CSS File -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="page-wrapper">

    <!-- ================= CREATE JOB SECTION ================= -->
    <section class="form-card">

      <div class="card-header">
        <div class="icon-box">≡ƒ¢á∩╕Å</div>

        <div>
          <h1>Create New Job</h1>
          <p class="subtitle">FieldOps Commander ΓÇó Job request entry</p>
        </div>
      </div>

      <form id="jobForm" novalidate>

        <div class="form-grid">

          <!-- Customer Name -->
          <div class="form-group">
            <label for="customer_name">Customer Name</label>

            <div class="input-box">
              
              <input
                type="text"
                id="customer_name"
                name="customer_name"
                placeholder="e.g. John Doe"
                required
              />
            </div>

            <span class="error-msg" id="err-customer_name"></span>
          </div>

          <!-- Location -->
          <div class="form-group">
            <label for="location">Location</label>

            <div class="input-box">
            
              <input
                type="text"
                id="location"
                name="location"
                placeholder="e.g. 123 Main St, Chennai"
                required
              />
            </div>

            <span class="error-msg" id="err-location"></span>
          </div>

          <!-- Issue -->
          <div class="form-group full-width">
            <label for="issue">Issue</label>

            <div class="input-box textarea-box">
              
              <textarea
                id="issue"
                name="issue"
                rows="5"
                placeholder="Describe the issue clearly..."
                required
              ></textarea>
            </div>

            <span class="error-msg" id="err-issue"></span>
          </div>

          <!-- Priority -->
          <div class="form-group full-width">
            <label for="priority">Priority</label>

            <div class="input-box">
              <select id="priority" name="priority" required>
                <option value="">-- Select Priority --</option>
                <option value="Critical">Critical</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
              </select>
            </div>

            <span class="error-msg" id="err-priority"></span>
          </div>

        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          Submit Job
        </button>

      </form>

      <!-- Create Job Success / Error Messages -->
      <div id="successMsg" class="alert alert-success" style="display:none;"></div>
      <div id="errorMsg" class="alert alert-error" style="display:none;"></div>

    </section>


    <!-- ================= JOBS DASHBOARD SECTION ================= -->
    <section class="dashboard-card">

    <div class="dashboard-header">
      <div>
        <h2>Jobs Dashboard</h2>
        <p class="subtitle">View and update existing field jobs</p>
      </div>

      <button type="button" class="refresh-btn" id="refreshJobsBtn">
        Refresh Jobs
      </button>
    </div>

    <!-- PASTE HERE -->

    <div class="filter-container">

      <div class="filter-group">
        <label for="statusFilter">Filter by Status</label>

        <select id="statusFilter">
          <option value="">All Status</option>
          <option value="active">Active</option>
          <option value="pending">Pending</option>
          <option value="inprogress">In Progress</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="priorityFilter">Filter by Priority</label>

        <select id="priorityFilter">
          <option value="">All Priority</option>
          <option value="Critical">Critical</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>
      </div>

    </div>

  <!-- Loading Text -->
  <div id="loadingText" class="loading-text" style="display:none;">
    Loading jobs...
  </div>

      <!-- Jobs List Will Display Here -->
      <div id="jobsContainer" class="jobs-container">
        <!-- Job cards will be added dynamically using JavaScript -->
      </div>

      <!-- No Jobs Message -->
      <div id="noJobsMsg" class="no-jobs-msg" style="display:none;">
        No jobs found.
      </div>

    </section>

  </main>


  <!-- ================= EDIT JOB MODAL ================= -->
  <div id="editModal" class="modal-overlay" style="display:none;">

    <div class="modal-box">

      <div class="modal-header">
        <h2>Edit Job</h2>
        <button type="button" id="closeEditModal" class="close-btn">
          ├ù
        </button>
      </div>

      <form id="editJobForm" novalidate>

        <!-- Hidden Job ID -->
        <input type="hidden" id="edit_job_id" />

        <!-- Edit Customer Name -->
        <div class="form-group">
          <label for="edit_customer_name">Customer Name</label>

          <div class="input-box">
            <span class="input-icon">≡ƒæñ</span>
            <input
              type="text"
              id="edit_customer_name"
              placeholder="Enter customer name"
              required
            />
          </div>
        </div>

        <!-- Edit Location -->
        <div class="form-group">
          <label for="edit_location">Location</label>

          <div class="input-box">
            
            <input
              type="text"
              id="edit_location"
              placeholder="Enter location"
              required
            />
          </div>
        </div>

        <!-- Edit Issue -->
        <div class="form-group">
          <label for="edit_issue">Issue</label>

          <div class="input-box textarea-box">
            
            <textarea
              id="edit_issue"
              rows="4"
              placeholder="Describe the issue"
              required
            ></textarea>
          </div>
        </div>

        <!-- Edit Priority -->
        <div class="form-group">
          <label for="edit_priority">Priority</label>
          <div class="input-box">
           
            <select id="edit_priority">
              <option value="">-- Select Priority --</option>
              <option value="Critical">Critical</option>
              <option value="High">High</option>
              <option value="Medium">Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>
        </div>

        <!-- Edit Status -->
        <div class="form-group">
          <label for="edit_status">Status</label>

          <div class="input-box">
            <select id="edit_status" required>
              <option value="">-- Select Status --</option>
              <option value="active">Active</option>
              <option value="pending">Pending</option>
              <option value="inprogress">In Progress</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="updateJobBtn">
          Update Job
        </button>

      </form>

      <!-- Edit Message -->
      <p id="editMessage"></p>

    </div>

  </div>


  <!-- JavaScript File -->
  <script src="js/app.js"></script>
</body>
</html>
